<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>스마트온실 디지털 트윈</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@1.3.9/dist/web/static/pretendard.css"
  />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
  />

  <style>
    :root {
      --bg-panel: rgba(255, 255, 255, 0.94);
      --bg-panel-solid: #ffffff;
      --bg-soft: #f5f4ee;
      --bg-softer: #ebeae3;
      --bd: rgba(25, 30, 25, 0.10);
      --bd-strong: rgba(25, 30, 25, 0.18);
      --fg: #1a1d1a;
      --fg-mute: #5a615a;
      --fg-dim: #8a8f87;
      --ok: #16a34a;
      --ok-soft: #dcfce7;
      --warn: #d97706;
      --warn-soft: #fef3c7;
      --bad: #dc2626;
      --bad-soft: #fee2e2;
      --accent: #0ea5e9;

      /* radius */
      --radius-xs: 4px;
      --radius-sm: 8px;
      --radius-md: 10px;
      --radius: 12px;
      --radius-pill: 999px;

      /* spacing */
      --gap-xs: 4px;
      --gap-sm: 6px;
      --gap-md: 8px;
      --gap-lg: 12px;
      --gap-xl: 16px;

      /* semantic opacity */
      --alpha-mute: 0.4;
      --alpha-strong: 0.6;

      --shadow:
        0 16px 40px -12px rgba(30, 40, 30, 0.18),
        0 4px 12px -4px rgba(30, 40, 30, 0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
      background: #e8e6df;
      color: var(--fg);
      font-family:
        'Pretendard',
        -apple-system,
        'Apple SD Gothic Neo',
        'Noto Sans KR',
        system-ui,
        sans-serif;
      letter-spacing: -0.005em;
      -webkit-font-smoothing: antialiased;
    }

    .mono {
      font-family: 'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, monospace;
      font-feature-settings: 'tnum' 1;
    }

    #root { height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/app/main.tsx"></script>
</body>
</html>
