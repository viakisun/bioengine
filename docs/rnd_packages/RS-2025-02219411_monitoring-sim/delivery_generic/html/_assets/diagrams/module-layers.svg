<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Apple SD Gothic Neo, -apple-system, Helvetica, sans-serif" font-size="13">
  <style>
    .box { fill:#fff; stroke:#000; stroke-width:1.2; }
    .label { fill:#000; font-weight:600; text-anchor:middle; }
    .sub   { fill:#333; font-size:10px; text-anchor:middle; }
    .layer-label { fill:#000; font-weight:700; font-size:11px; text-anchor:start; letter-spacing:0.5px; }
    .arrow { fill:none; stroke:#000; stroke-width:1.2; marker-end:url(#arrowhead); }
    .layer-rule { fill:none; stroke:#888; stroke-width:0.4; stroke-dasharray:3,3; }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="11" markerHeight="11" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,10 L10,5 Z" fill="#000"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="450" y="28" class="label" font-size="15">시뮬레이터 모듈 계층 구조</text>

  <!-- Layer rules -->
  <line x1="40" y1="80" x2="860" y2="80" class="layer-rule"/>
  <line x1="40" y1="170" x2="860" y2="170" class="layer-rule"/>
  <line x1="40" y1="280" x2="860" y2="280" class="layer-rule"/>
  <line x1="40" y1="390" x2="860" y2="390" class="layer-rule"/>
  <line x1="40" y1="490" x2="860" y2="490" class="layer-rule"/>

  <!-- Layer Names (left margin) -->
  <text x="50" y="60"  class="layer-label">UI / Workbench</text>
  <text x="50" y="118" class="layer-label">Scene / Engine</text>
  <text x="50" y="200" class="layer-label">Domain (Phenotyping)</text>
  <text x="50" y="305" class="layer-label">Detection</text>
  <text x="50" y="412" class="layer-label">Streaming</text>
  <text x="50" y="500" class="layer-label">Infra</text>

  <!-- L1 UI -->
  <rect x="250" y="95" width="160" height="60" rx="2" class="box"/>
  <text x="330" y="120" class="label">Workbench</text>
  <text x="330" y="138" class="sub">React + Zustand</text>

  <rect x="430" y="95" width="160" height="60" rx="2" class="box"/>
  <text x="510" y="120" class="label">Picker / ModeSelector</text>
  <text x="510" y="138" class="sub">Scenario UI</text>

  <rect x="610" y="95" width="160" height="60" rx="2" class="box"/>
  <text x="690" y="120" class="label">Result Sheet</text>
  <text x="690" y="138" class="sub">Result / History</text>

  <!-- L2 Scene -->
  <rect x="250" y="195" width="160" height="60" rx="2" class="box"/>
  <text x="330" y="220" class="label">BabylonEngine</text>
  <text x="330" y="238" class="sub">WebGL2 / WebGPU</text>

  <rect x="430" y="195" width="160" height="60" rx="2" class="box"/>
  <text x="510" y="220" class="label">Plant / Mesh</text>
  <text x="510" y="238" class="sub">Skeleton / Anchors</text>

  <rect x="610" y="195" width="160" height="60" rx="2" class="box"/>
  <text x="690" y="220" class="label">Scenarios</text>
  <text x="690" y="238" class="sub">Loader / Seed</text>

  <!-- L3 Domain -->
  <rect x="250" y="295" width="160" height="60" rx="2" class="box"/>
  <text x="330" y="320" class="label">SurveyRunner</text>
  <text x="330" y="338" class="sub">traverse + stitch</text>

  <rect x="430" y="295" width="160" height="60" rx="2" class="box"/>
  <text x="510" y="320" class="label">FrameCapture</text>
  <text x="510" y="338" class="sub">gimbal viewport</text>

  <!-- L4 Detection -->
  <rect x="250" y="405" width="160" height="60" rx="2" class="box"/>
  <text x="330" y="430" class="label">HSV Detector</text>
  <text x="330" y="448" class="sub">5-band ripeness</text>

  <rect x="430" y="405" width="160" height="60" rx="2" class="box"/>
  <text x="510" y="430" class="label">ONNX YOLOv8</text>
  <text x="510" y="448" class="sub">Web Worker</text>

  <rect x="610" y="405" width="160" height="60" rx="2" class="box"/>
  <text x="690" y="430" class="label">Detection Worker Client</text>
  <text x="690" y="448" class="sub">postMessage bridge</text>

  <!-- L5 Streaming / Infra -->
  <rect x="160" y="500" width="160" height="32" rx="2" class="box"/>
  <text x="240" y="521" class="label">WS Stream Producer</text>

  <rect x="340" y="500" width="160" height="32" rx="2" class="box"/>
  <text x="420" y="521" class="label">MJPEG over WebSocket</text>

  <rect x="520" y="500" width="160" height="32" rx="2" class="box"/>
  <text x="600" y="521" class="label">Logger / Telemetry</text>

  <rect x="700" y="500" width="120" height="32" rx="2" class="box"/>
  <text x="760" y="521" class="label">twinStore</text>

  <!-- Vertical flow arrows (key dependencies) -->
  <line x1="330" y1="156" x2="330" y2="194" class="arrow"/>
  <line x1="510" y1="156" x2="510" y2="194" class="arrow"/>
  <line x1="690" y1="156" x2="690" y2="194" class="arrow"/>

  <line x1="330" y1="256" x2="330" y2="294" class="arrow"/>
  <line x1="510" y1="256" x2="510" y2="294" class="arrow"/>

  <line x1="330" y1="356" x2="330" y2="404" class="arrow"/>
  <line x1="510" y1="356" x2="510" y2="404" class="arrow"/>

  <line x1="330" y1="466" x2="240" y2="499" class="arrow"/>
  <line x1="510" y1="466" x2="420" y2="499" class="arrow"/>
  <line x1="690" y1="466" x2="600" y2="499" class="arrow"/>
</svg>
